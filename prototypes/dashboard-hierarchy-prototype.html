<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prototype — Production readiness dashboard hierarchy</title>
    <style>
      :root { color-scheme: light; --ink:#18222c; --muted:#62707c; --paper:#f7f7f5; --line:#dbe0df; --green:#087f5b; --amber:#b56800; --red:#c23934; --blue:#2d63c8; --navy:#11263d; }
      * { box-sizing: border-box; }
      body { margin:0; min-width:320px; color:var(--ink); background:var(--paper); font: 15px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      button, a { font: inherit; } button { cursor:pointer; }
      ::selection { background:#c7e7da; color:var(--ink); }
      .shell { max-width:1180px; margin:auto; padding:32px 28px 112px; }
      .site-head { display:flex; align-items:center; justify-content:space-between; gap:20px; padding-bottom:22px; border-bottom:1px solid var(--line); }
      .brand { display:flex; align-items:center; gap:11px; font-weight:750; letter-spacing:-.025em; }
      .primary-nav { display:flex; gap:4px; margin-left:auto; margin-right:20px; }.primary-nav button { border:0; border-radius:8px; padding:7px 9px; background:transparent; color:var(--muted); font-size:.82rem; font-weight:750; }.primary-nav button:hover,.primary-nav button[aria-current="page"] { color:var(--ink); background:#edf0ef; }
      .mark { width:26px; height:26px; border-radius:9px 9px 9px 2px; background:var(--navy); position:relative; }
      .mark:after { content:""; width:8px; height:8px; background:#8fe0bf; border-radius:50%; position:absolute; right:5px; top:5px; }
      .live { color:var(--green); font-size:.84rem; font-weight:650; display:flex; align-items:center; gap:7px; }
      .live:before { content:""; width:8px; height:8px; border-radius:50%; background:currentColor; box-shadow:0 0 0 5px #d9f3e8; }
      h1,h2,h3,p { margin:0; } h1 { max-width:18ch; font-size:clamp(2.3rem,5vw,4.9rem); line-height:.96; letter-spacing:-.065em; } h2 { font-size:1.22rem; letter-spacing:-.025em; } h3 { font-size:1rem; letter-spacing:-.015em; }
      .lede { max-width:59ch; color:var(--muted); font-size:1.05rem; margin-top:18px; }
      .label { color:var(--muted); text-transform:uppercase; letter-spacing:.095em; font-size:.7rem; font-weight:750; }
      .chip { display:inline-flex; align-items:center; padding:5px 9px; border-radius:999px; font-size:.76rem; font-weight:750; border:1px solid currentColor; white-space:nowrap; }
      .hold { color:var(--red); background:#fff3f2; }.fix { color:var(--amber); background:#fff8e9; }.ship { color:var(--green); background:#eefbf5; }.info { color:var(--blue); background:#eff5ff; }
      .metric { font-variant-numeric:tabular-nums; letter-spacing:-.05em; }
      .small { color:var(--muted); font-size:.86rem; }
      .rule { height:1px; background:var(--line); }
      .action { background:var(--navy); color:white; border:0; border-radius:10px; padding:10px 13px; font-weight:700; box-shadow:0 5px 12px rgba(0,0,0,.16); }
      .action:hover { background:#1d4268; }.action:focus-visible,a:focus-visible { outline:3px solid #8db1f4; outline-offset:3px; }
      .matrix { display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
      .lens { min-height:92px; padding:11px 10px; border-radius:12px; border:1px solid var(--line); background:white; display:flex; flex-direction:column; justify-content:space-between; }
      .lens.running { border-color:#79a2e9; background:#f1f6ff; }.lens.done { border-color:#9bd8bf; background:#f3fcf7; }.lens.wait { opacity:.72; }
      .lens b { font-size:.82rem; }.lens em { color:var(--muted); font-size:.72rem; font-style:normal; }
      .dot { width:8px; height:8px; border-radius:50%; background:#aeb8bf; }.dot.green { background:var(--green); }.dot.blue { background:var(--blue); }.dot.amber { background:var(--amber); }
      .row { display:grid; grid-template-columns:26px minmax(160px,1fr) auto; gap:12px; align-items:start; padding:16px 0; border-bottom:1px solid var(--line); }.row:last-child { border:0; }
      .sev { width:26px; height:26px; display:grid; place-items:center; border-radius:8px; font-size:.72rem; font-weight:800; }.p0{background:#ffdfdd;color:#972824}.p1{background:#fff0cb;color:#925700}.p2{background:#e3edff;color:#2859a8}
      .finding-title { font-weight:750; letter-spacing:-.018em; }.finding-meta { color:var(--muted); font-size:.83rem; margin-top:2px; }
      .bottom-note { color:var(--muted); font-size:.78rem; margin-top:14px; }
      .guided-head { display:grid; grid-template-columns:1.2fr .8fr; gap:42px; padding:53px 0 32px; }.guided-head h1 { max-width:13ch; font-size:clamp(2.15rem,4.3vw,4.35rem); }.state-line { color:var(--green); font-weight:800; font-size:.9rem; }.next-action { align-self:end; padding:22px 23px; border-radius:15px; background:#fff; border:1px solid var(--line); box-shadow:0 9px 25px rgba(0,0,0,.07); }.next-action h2 { margin-top:7px; font-size:1.24rem; }.next-action p { color:var(--muted); margin-top:8px; }.next-action .action { margin-top:16px; }
      .guided-grid { display:grid; grid-template-columns:1.1fr .9fr; gap:42px; padding-top:28px; border-top:1px solid var(--line); }.run-list { margin-top:13px; }.run-row { display:grid; grid-template-columns:10px 1fr auto; align-items:center; gap:11px; width:100%; padding:13px 0; border:0; border-bottom:1px solid var(--line); background:transparent; color:var(--ink); text-align:left; font:inherit; cursor:pointer; }.run-row:hover strong { color:var(--blue); text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:3px; }.run-row small { color:var(--muted); }.run-row .run-status { color:var(--muted); font-size:.78rem; font-weight:700; }.latest { padding:0 0 18px; border-bottom:1px solid var(--line); }.latest h2 { margin-top:8px; }.latest p { color:var(--muted); margin-top:8px; }.risk-strip { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:21px; }.risk-strip div { padding-top:12px; border-top:1px solid var(--line); }.risk-strip strong { display:block; font-size:1.85rem; line-height:1; }.risk-strip span { color:var(--muted); font-size:.77rem; }
      .lens { text-align:left; font:inherit; color:inherit; cursor:pointer; transition:transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease; }
      .lens:hover { transform:translateY(-2px); border-color:#5c8ce2; box-shadow:0 8px 18px rgba(0,0,0,.08); }.lens:focus-visible { outline:3px solid #8db1f4; outline-offset:3px; }
      .lens .open-run { color:var(--blue); font-size:.7rem; font-weight:800; opacity:0; transition:opacity 160ms ease; }.lens:hover .open-run,.lens:focus-visible .open-run { opacity:1; }
      .route-head { padding:37px 0 26px; border-bottom:1px solid var(--line); }.route-head h1 { font-size:clamp(2rem,4vw,3.75rem); max-width:18ch; }
      .detail-grid { display:grid; grid-template-columns:1.25fr .75fr; gap:38px; padding-top:34px; }.detail-copy { max-width:64ch; }.detail-copy p { color:var(--muted); margin-top:10px; }.evidence-list { padding:0; margin:19px 0 0; list-style:none; }.evidence-list li { padding:14px 0; border-bottom:1px solid var(--line); }.evidence-list a { color:var(--blue); font-weight:750; text-decoration-thickness:1px; text-underline-offset:3px; }.run-facts { padding:23px; border-radius:15px; background:#eef4ff; }.run-facts dl { margin:16px 0 0; }.run-facts dt { color:var(--muted); font-size:.76rem; margin-top:14px; }.run-facts dd { margin:2px 0 0; font-weight:750; }
      .report-body { max-width:840px; padding:36px 0; }.report-body > p { color:var(--muted); margin-top:10px; }.report-section { padding:26px 0; border-bottom:1px solid var(--line); }.report-section h2 { font-size:1.45rem; }.report-section p { color:var(--muted); margin-top:8px; }
      .scrim { position:fixed; inset:0; z-index:9; background:rgba(17,38,61,.22); }.ledger-drawer { position:fixed; z-index:10; right:0; top:0; bottom:0; width:min(470px,100%); overflow:auto; background:#fff; padding:28px; box-shadow:-20px 0 45px rgba(0,0,0,.16); animation:drawer-in 190ms ease-out; }.drawer-head { display:flex; justify-content:space-between; gap:15px; align-items:flex-start; padding-bottom:21px; border-bottom:1px solid var(--line); }.close { border:0; background:#edf0ef; color:var(--ink); border-radius:9px; width:34px; height:34px; font-size:1.1rem; }.filters { display:flex; gap:7px; flex-wrap:wrap; margin:19px 0 8px; }.filter { border:1px solid var(--line); color:var(--ink); background:#fff; border-radius:999px; padding:6px 9px; font-size:.75rem; font-weight:750; }.filter[aria-pressed="true"] { background:var(--navy); color:#fff; border-color:var(--navy); }.ledger-item { padding:18px 0; border-bottom:1px solid var(--line); }.ledger-item strong { display:block; }.ledger-item p { color:var(--muted); font-size:.86rem; margin-top:5px; }.ledger-item a { color:var(--blue); font-size:.83rem; font-weight:750; }
      @keyframes drawer-in { from { transform:translateX(24px); opacity:.6; } to { transform:translateX(0); opacity:1; } }
      .prototype-note { position:fixed; left:0; top:0; right:0; z-index:4; text-align:center; padding:5px; background:#f8df9c; color:#654600; font-size:.73rem; font-weight:700; }
      .prototype-note + .shell { padding-top:52px; }
      /* Variant A: verdict-first mission control */
      .mission-hero { display:grid; grid-template-columns:1.35fr .65fr; gap:34px; padding:64px 0 42px; }.verdict-panel { align-self:end; padding:24px; border-radius:16px; background:var(--navy); color:#f9fbfa; box-shadow:0 16px 33px rgba(0,0,0,.18); }.verdict-panel .label,.verdict-panel .small { color:#b8c9d7; }.verdict-panel .metric { font-size:3.9rem; line-height:.9; margin:10px 0 18px; }.verdict-panel .chip { color:#ffb4af; background:#3c2633; }.mission-sections { display:grid; grid-template-columns:1.4fr .6fr; gap:34px; padding-top:34px; }.score-list { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }.score { padding:16px 0; border-top:1px solid var(--line); }.score strong { display:block; font-size:2.2rem; line-height:1; }.score span { color:var(--muted); font-size:.78rem; }
      /* Variant B: finding-first review queue */
      .queue-head { padding:60px 0 29px; display:flex; justify-content:space-between; gap:30px; align-items:end; }.queue-grid { display:grid; grid-template-columns:2fr .8fr; gap:35px; align-items:start; }.queue { background:white; border:1px solid var(--line); border-radius:16px; padding:8px 22px; }.queue-side { position:sticky; top:22px; }.side-block { padding:19px 0; border-bottom:1px solid var(--line); }.side-block:last-child{border-bottom:0}.stage { display:flex; gap:10px; margin-top:13px; align-items:center; }.stage span:nth-child(2) { flex:1; }.bar { height:5px; width:66px; overflow:hidden; border-radius:9px; background:#e1e6e7; }.bar i { display:block; height:100%; background:var(--green); border-radius:inherit; }.queue-count { display:flex; gap:8px; margin-top:17px; flex-wrap:wrap; }
      /* Variant C: live audit story */
      .story-head { padding:59px 0 29px; }.story-grid { display:grid; grid-template-columns:.75fr 1.25fr; gap:46px; align-items:start; }.timeline { margin:0; padding:0; }.event { position:relative; display:grid; grid-template-columns:18px minmax(0,1fr); column-gap:18px; padding:0 0 28px; }.event:not(:last-child):after { content:""; position:absolute; left:8px; top:11px; bottom:-11px; width:2px; background:#ccd7d8; }.timeline-marker { position:relative; z-index:1; width:18px; height:18px; margin-top:2px; border:3px solid var(--paper); border-radius:50%; background:#abb7bc; }.event.done .timeline-marker{background:var(--green)}.event.now .timeline-marker{background:var(--blue);box-shadow:0 0 0 5px #dce9ff}.event .time{color:var(--muted);font-size:.77rem}.event p{margin-top:3px;font-size:.9rem}.story-focus { background:#fff; border:1px solid var(--line); border-radius:16px; padding:26px; }.current { display:flex; justify-content:space-between; gap:18px; align-items:start; padding-bottom:23px; border-bottom:1px solid var(--line); }.current .metric{font-size:3rem;line-height:.9}.evidence { margin-top:22px; display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }.evidence div{padding:13px 0;border-top:1px solid var(--line)}.evidence strong{display:block;font-size:1.8rem;line-height:1}.evidence span{color:var(--muted);font-size:.76rem}
      @media (max-width:780px){.shell{padding:22px 18px 60px}.site-head{padding-bottom:16px;flex-wrap:wrap}.primary-nav{order:3;width:100%;margin:0}.mission-hero,.mission-sections,.queue-grid,.story-grid,.detail-grid,.guided-head,.guided-grid{grid-template-columns:1fr;gap:25px}.mission-hero{padding:39px 0 24px}.guided-head{padding:39px 0 25px}.queue-head{padding:40px 0 22px;display:block}.queue-head .action{margin-top:18px}.queue-side{position:static}.matrix{grid-template-columns:repeat(3,1fr)}.score-list,.evidence{grid-template-columns:repeat(3,1fr)}.story-head{padding:40px 0 23px}.verdict-panel .metric{font-size:3.2rem}.ledger-drawer{padding:22px}}
      @media (max-width:450px){.live{font-size:0}.live:before{margin:0}.matrix{grid-template-columns:repeat(2,1fr)}.score-list,.evidence{grid-template-columns:1fr}.row{grid-template-columns:26px 1fr}.row .chip{grid-column:2}}
    </style>
  </head>
  <body>
    <!--
      THESIS: A production-readiness viewer should make its current decision obvious before asking a user to read its evidence.
      OWN-WORLD: Quiet operations notebook — warm paper, navy ink, green/amber/red evidence states, precise lines instead of card stacks.
      STORY: A user sees whether to ship, what is happening now, and where the real risk lives without losing the evidence trail.
      FIRST VIEWPORT: The live audit story exposes what has happened, what is running, and what will happen next.
      FORM: One static hierarchy experiment, code-led, no production visual system implied.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance.
    -->
    <div class="prototype-note">THROWAWAY PROTOTYPE — choose a hierarchy; none of this is the shipped dashboard.</div>
    <main id="app" class="shell"></main>
    <script>
      const data = {
        lenses: [['Security','done'],['Backend','done'],['Database','done'],['DevOps','running'],['QA','running'],['Frontend','wait'],['AI security','wait']],
        findings: [
          ['P0','Public write endpoint accepts requests without rate limiting','Security · CONFIRMED'],
          ['P1','No restore drill was found for production data','Database · NOT FOUND'],
          ['P1','Critical checkout path lacks an end-to-end test','QA · CONFIRMED'],
          ['P2','Alert routing is outside reviewed repository scope','DevOps · UNVERIFIED']
        ]
      };
      const head = (live = true) => `<header class="site-head"><div class="brand"><span class="mark"></span> prod-readiness</div><nav class="primary-nav" aria-label="Dashboard"><button data-action="overview">Overview</button><button data-action="findings">Findings</button><button data-action="ledger">Evidence</button><button data-action="report">Report</button></nav><div class="${live ? 'live' : 'small'}">${live ? 'Watching audit files' : 'Final report'}</div></header>`;
      const lensKey = name => name.toLowerCase().replace(/\s+/g, '-');
      const lenses = () => `<div class="matrix">${data.lenses.map(([name,status]) => `<button class="lens ${status}" data-lens="${lensKey(name)}" aria-label="Open ${name} agent run"><span class="dot ${status === 'done' ? 'green' : status === 'running' ? 'blue' : ''}"></span><b>${name}</b><em>${status === 'done' ? 'Complete' : status === 'running' ? 'Reviewing now' : 'Waiting'}</em><span class="open-run">Open run →</span></button>`).join('')}</div>`;
      const findings = (limit = 4) => data.findings.slice(0,limit).map(([severity,title,meta]) => `<article class="row"><span class="sev ${severity.toLowerCase()}">${severity}</span><div><div class="finding-title">${title}</div><div class="finding-meta">${meta}</div></div><span class="chip ${severity === 'P0' ? 'hold' : severity === 'P1' ? 'fix' : 'info'}">${severity === 'P0' ? 'Blocks ship' : 'Needs review'}</span></article>`).join('');
      const mission = () => { const complete = params().get('audit') === 'complete'; const state = complete ? { line:'Audit complete · decision ready', title:'One confirmed blocker needs your attention.', copy:'The audit finished. Start with the rate-limit gap before deciding whether this release can ship.', action:'Review the P0 blocker', detail:'Security confirmed a public write-path control gap.', status:'HOLD — do not deploy' } : { line:'Audit running · Stage 3 of 5', title:'Two lenses are reviewing. Nothing is needed from you yet.', copy:'DevOps and QA are checking their evidence now. The next step is automated validation, then the remaining review wave.', action:'See the latest signal', detail:'Security has already confirmed one P0 gap.', status:'Live audit' }; return `${head(!complete)}<section class="guided-head"><div><p class="state-line">${state.line}</p><h1>${state.title}</h1><p class="lede">${state.copy}</p></div><aside class="next-action"><p class="label">Your next action</p><h2>${complete ? 'Decide how to handle the P0 blocker.' : 'Wait for this review wave to finish.'}</h2><p>${complete ? 'Open the security run to see the evidence and recommended fix.' : 'The dashboard will update when validation can begin; you do not need to steer the audit.'}</p><button class="action" data-action="${complete ? 'security' : 'latest'}">${state.action} →</button></aside></section><section class="guided-grid"><div><p class="label">Review flow</p><div class="run-list">${data.lenses.map(([name,status]) => `<button class="run-row" data-lens="${lensKey(name)}"><span class="dot ${status === 'done' ? 'green' : status === 'running' ? 'blue' : ''}"></span><span><strong>${name}</strong><br><small>${status === 'done' ? 'Review complete' : status === 'running' ? 'Reviewing now' : 'Queued after validation'}</small></span><span class="run-status">Open →</span></button>`).join('')}</div><p class="bottom-note">The audit remains read-only. Every lens writes only its audit artifact.</p></div><aside><div class="latest"><p class="label">Latest signal</p><h2>${state.detail}</h2><p>${complete ? 'This is now the first item to resolve. The final report explains the release impact.' : 'You can inspect the run, but the primary job is to let the active agents finish.'}</p></div><div class="risk-strip"><div><strong class="metric">1</strong><span>P0 blocker</span></div><div><strong class="metric">2</strong><span>P1 risks</span></div><div><strong class="metric">4</strong><span>Unverified</span></div></div><p class="bottom-note">Current release state: <strong>${state.status}</strong></p></aside></section>`; };
      const queue = () => `${head()}<section class="queue-head"><div><p class="label">Production readiness audit</p><h1>Fix what keeps this from shipping.</h1><p class="lede">A triage-first view for the moment the team needs to turn an audit into an ordered work queue.</p></div><button class="action" data-action="ledger">Open evidence ledger ↗</button></section><section class="queue-grid"><div class="queue"><div class="row"><div></div><div><h2>Findings requiring a decision</h2><p class="small">4 evidence-backed items in this review</p></div></div>${findings()}</div><aside class="queue-side"><div class="side-block"><p class="label">Ship status</p><p style="margin-top:9px"><span class="chip hold">HOLD — do not deploy</span></p></div><div class="side-block"><p class="label">Audit progress</p>${data.lenses.slice(0,5).map(([name,status],i) => `<div class="stage"><span class="dot ${status === 'done' ? 'green' : status === 'running' ? 'blue' : ''}"></span><span class="small">${name}</span><span class="bar"><i style="width:${status === 'done' ? 100 : status === 'running' ? 58 : 0}%"></i></span></div>`).join('')}</div><div class="side-block"><p class="label">Evidence state</p><div class="queue-count"><span class="chip ship">12 confirmed</span><span class="chip fix">7 not found</span><span class="chip info">4 unverified</span></div></div></aside></section>`;
      const story = () => `${head()}<section class="story-head"><p class="label">Live audit timeline</p><h1>The audit is building its case.</h1><p class="lede">A progress-first view for someone waiting to understand what the agents have inspected, proven, and still need.</p></section><section class="story-grid"><div class="timeline"><div class="event done"><span class="timeline-marker" aria-hidden="true"></span><div><span class="time">09:42</span><h3>Preflight recorded</h3><p>Git ref, dirty state, and parallel mode saved.</p></div></div><div class="event done"><span class="timeline-marker" aria-hidden="true"></span><div><span class="time">09:44</span><h3>Evidence map written</h3><p>218 files indexed; absence ledger ready.</p></div></div><div class="event now"><span class="timeline-marker" aria-hidden="true"></span><div><span class="time">09:47 · now</span><h3>Specialist lenses reviewing</h3><p>DevOps and QA are writing their findings.</p></div></div><div class="event"><span class="timeline-marker" aria-hidden="true"></span><div><span class="time">next</span><h3>Validate and assemble</h3><p>Findings will be checked before a verdict is written.</p></div></div></div><article class="story-focus"><div class="current"><div><p class="label">Current stage</p><div class="metric" style="margin-top:8px">3 / 5</div><p class="small" style="margin-top:8px">Specialist review</p></div><span class="chip info">Live refresh</span></div><div style="margin-top:22px"><h2>What the audit knows so far</h2><p class="small" style="margin-top:6px">Not a verdict yet. These counts update as agents write evidence-tagged findings.</p><div class="evidence"><div><strong class="metric">3</strong><span>complete lenses</span></div><div><strong class="metric">2</strong><span>active lenses</span></div><div><strong class="metric">7</strong><span>missing controls</span></div></div></div><div style="margin-top:25px"><p class="label" style="margin-bottom:7px">Latest signal</p><div class="finding-title">P0 rate-limit gap confirmed</div><div class="finding-meta">Security lens · file and line evidence linked in report</div></div></article></section>`;
      const lensInfo = {
        security: { name:'Security', status:'Complete', time:'09:46', summary:'One launch-blocking rate-limit gap was confirmed. The security lens completed its evidence and wrote a finding file.', findings:'1 confirmed P0 · 1 deferred control', files:'findings/security.md', evidence:'evidence/absence-ledger.json#rate-limiting' },
        backend: { name:'Backend', status:'Complete', time:'09:46', summary:'Backend paths were mapped and no launch blocker was raised in the sample audit.', findings:'0 P0/P1 findings · 2 follow-ups', files:'findings/backend.md', evidence:'evidence/map.md#write-paths' },
        database: { name:'Database', status:'Complete', time:'09:47', summary:'The database lens identified a missing restore drill and recorded the scope boundary.', findings:'1 P1 NOT FOUND · 1 UNVERIFIED', files:'findings/database.md', evidence:'evidence/absence-ledger.json#restore-drill' },
        devops: { name:'DevOps', status:'Reviewing now', time:'Live', summary:'This lens is still evaluating deployment, rollback, and operational controls.', findings:'No final findings yet', files:'findings/devops.md', evidence:'evidence/inventory.json' },
        qa: { name:'QA', status:'Reviewing now', time:'Live', summary:'This lens is checking the critical path and test signals before it writes its final findings.', findings:'1 draft P1 · validation pending', files:'findings/qa.md', evidence:'evidence/map.md#critical-paths' },
        frontend: { name:'Frontend', status:'Waiting', time:'Queued', summary:'This lens starts after the first review wave is validated.', findings:'Not started', files:'findings/frontend.md', evidence:'evidence/map.md' },
        'ai-security': { name:'AI security', status:'Waiting', time:'Queued', summary:'This lens will confirm whether AI-specific attack surface exists before spending review time.', findings:'Not started', files:'findings/ai-security.md', evidence:'evidence/inventory.json' }
      };
      const params = () => new URLSearchParams(location.search);
      function navigate(next = {}) { const url = new URL(location); Object.entries(next).forEach(([key, value]) => value == null ? url.searchParams.delete(key) : url.searchParams.set(key, value)); history.pushState({}, '', url); render(); }
      function lensDetail(key) { const lens = lensInfo[key] || lensInfo.security; return `${head(lens.status !== 'Complete')}<section class="route-head"><p class="label">Agent run details</p><h1>${lens.name} lens</h1></section><section class="detail-grid"><article class="detail-copy"><span class="chip ${lens.status === 'Complete' ? 'ship' : lens.status === 'Waiting' ? 'info' : 'fix'}">${lens.status}</span><h2 style="margin-top:22px">What this run is doing</h2><p>${lens.summary}</p><h2 style="margin-top:32px">Evidence and output</h2><ul class="evidence-list"><li><strong>Findings</strong><br><a href="#${lens.files}">${lens.files}</a><p class="small">${lens.findings}</p></li><li><strong>Evidence source</strong><br><a href="#${lens.evidence}">${lens.evidence}</a></li><li><strong>Run notes</strong><p class="small">The dashboard links to the raw artifact rather than reproducing its contents, so this page stays a navigational summary.</p></li></ul></article><aside class="run-facts"><p class="label">Run facts</p><dl><dt>Agent</dt><dd>${lens.name} specialist</dd><dt>Status</dt><dd>${lens.status}</dd><dt>Last update</dt><dd>${lens.time}</dd><dt>Write boundary</dt><dd>.readiness-audit/ only</dd></dl></aside></section>`; }
      function report() { return `${head(false)}<section class="route-head"><p class="label">Rendered audit report</p><h1>Production readiness report</h1></section><article class="report-body"><span class="chip hold">HOLD — do not deploy</span><p>This is the dashboard’s readable rendering of <code>report.md</code>. It is a full report destination, not a download or an external handoff.</p><section class="report-section"><h2>Executive verdict</h2><p>One confirmed public write-path control gap blocks launch. Two serious risks require a fix plan, and four controls remain unverified inside the reviewed scope.</p></section><section class="report-section"><h2>Production blockers</h2>${findings(1)}</section><section class="report-section"><h2>Serious risks</h2>${findings(3).split('</article>').slice(1).join('</article>')}</section><section class="report-section"><h2>Evidence boundaries</h2><p>Controls marked UNVERIFIED need external evidence or a wider review scope. The ledger drawer stays available from the dashboard for the underlying probes.</p></section></article>`; }
      function ledgerDrawer() { const filter = params().get('filter') || 'all'; const controls = [['CONFIRMED','Rate limit configuration','Security lens located the public write path and confirmed the missing control.'],['NOT FOUND','Restore drill','No restore drill was found in reviewed infrastructure scope.'],['UNVERIFIED','Alert routing','Alert delivery is not visible in this repository.'],['CONFIRMED','Checkout test path','QA linked the existing test evidence.']]; const shown = controls.filter(([state]) => filter === 'all' || state === filter); return `<div class="scrim" data-action="close-ledger"></div><aside class="ledger-drawer" aria-label="Evidence ledger" role="dialog" aria-modal="true"><header class="drawer-head"><div><p class="label">Evidence ledger</p><h2 style="margin-top:5px">What was checked</h2><p class="small" style="margin-top:5px">Contextual detail for the current audit.</p></div><button class="close" data-action="close-ledger" aria-label="Close evidence ledger">×</button></header><div class="filters">${['all','CONFIRMED','NOT FOUND','UNVERIFIED'].map(value => `<button class="filter" data-filter="${value}" aria-pressed="${filter === value}">${value === 'all' ? 'All controls' : value}</button>`).join('')}</div>${shown.map(([state,title,copy]) => `<article class="ledger-item"><span class="chip ${state === 'CONFIRMED' ? 'ship' : state === 'NOT FOUND' ? 'fix' : 'info'}">${state}</span><strong style="margin-top:9px">${title}</strong><p>${copy}</p><a href="#evidence/${title.toLowerCase().replaceAll(' ','-')}">Open supporting evidence →</a></article>`).join('')}</aside>`; }
      function render() { const view = params().get('view'); const app = document.getElementById('app'); app.innerHTML = view === 'lens' ? lensDetail(params().get('lens')) : view === 'report' ? report() : view === 'findings' ? queue() : story(); document.querySelectorAll('.primary-nav button').forEach(button => button.removeAttribute('aria-current')); const active = params().get('drawer') === 'ledger' ? 'ledger' : view === 'findings' ? 'findings' : view === 'report' ? 'report' : 'overview'; document.querySelector(`.primary-nav [data-action="${active}"]`)?.setAttribute('aria-current','page'); document.querySelectorAll('.ledger-drawer,.scrim').forEach(node => node.remove()); if (params().get('drawer') === 'ledger' && !view) document.body.insertAdjacentHTML('beforeend', ledgerDrawer()); }
      document.addEventListener('click', event => { const lens = event.target.closest('[data-lens]'); const action = event.target.closest('[data-action]'); const filter = event.target.closest('[data-filter]'); if (lens) navigate({view:'lens', lens:lens.dataset.lens, drawer:null}); if (action?.dataset.action === 'overview') navigate({variant:null, view:null, lens:null, drawer:null}); if (action?.dataset.action === 'findings') navigate({variant:null, view:'findings', lens:null, drawer:null}); if (action?.dataset.action === 'report') navigate({variant:null, view:'report', lens:null, drawer:null}); if (action?.dataset.action === 'ledger') navigate({variant:null, drawer:'ledger'}); if (action?.dataset.action === 'security' || action?.dataset.action === 'latest') navigate({view:'lens', lens:'security', drawer:null}); if (action?.dataset.action === 'close-ledger') navigate({drawer:null}); if (filter) navigate({filter:filter.dataset.filter}); });
      window.addEventListener('keydown', event => { if (event.key === 'Escape' && params().get('drawer')) navigate({drawer:null, filter:null}); });
      window.addEventListener('popstate', render); render();
    </script>
  </body>
</html>
